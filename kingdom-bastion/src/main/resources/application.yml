server:
  forward-headers-strategy: framework

spring:
  application:
    name: bastion
  data:
    mongodb:
      uri: ${KINGDOM_MONGODB_URI:mongodb://localhost:27017/kingdom_db}

kingdom:
  postern:
    trusted-networks: []
    trusted-ips: []
    trusted-proxies: []
  sentinel:
    jwt:
      public-key: file:/app/keys/bastion-public.pem
      private-key: file:/app/keys/bastion-private.pem
      key-id: bastion-key-1 
  passport:
    cookie:
      name: KINGDOM_PASSPORT
      same-site: Lax

logging:
  level:
    org.springframework.cloud.gateway.handler.FilteringWebHandler: TRACE
    org.springframework.cloud.gateway.filter.NettyRoutingFilter: TRACE
    org.springframework.cloud.gateway.filter.RouteToRequestUrlFilter: TRACE
      

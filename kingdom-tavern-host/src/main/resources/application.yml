server:
  port: 8080

kingdom:
  tavern:
    host:
      mode: ${KINGDOM_TAVERN_HOST_MODE:STATIC}
      source: /app/tavern
      api-proxy-url: ${KINGDOM_TAVERN_API_PROXY_URL:}
    emissary:
      enabled: true
      bastion-url: ${KINGDOM_BASTION_URL:}
      username: ${KINGDOM_BASTION_USERNAME:}
      password: ${KINGDOM_BASTION_PASSWORD:}
      health-path: /internal/kingdom/health 
      capabilities: ${KINGDOM_TAVERN_CAPABILITIES:ui}
      tavern-name: ${KINGDOM_TAVERN_NAME:}
      target: http://${kingdom.tavern.emissary.tavern-name}:${server.port}
      domain: ${KINGDOM_TAVERN_DOMAIN:}
      path: ${KINGDOM_TAVERN_PATH:}
      public-paths: ${KINGDOM_TAVERN_PUBLIC_PATHS:}
    lock:
      enabled: ${KINGDOM_TAVERN_LOCK_ENABLED:false}